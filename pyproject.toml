[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Routes each LLM request to the cheapest model that can handle it, and verifies the routing was right."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
autopilot = "cost_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
